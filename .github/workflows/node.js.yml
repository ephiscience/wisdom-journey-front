name: Node.js CI

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - run: 'corepack enable'
      - name: 'Install Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      - run: 'yarn install --immutable'
      - run: 'yarn lint'


  locales:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - run: 'corepack enable'
      - name: 'Install Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      - run: 'yarn install --immutable'
      - run: yarn run test:ci:locales
        continue-on-error: true
        env:
          CI: true
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - run: 'corepack enable'
      - name: 'Install Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      - run: 'yarn install --immutable'
      - run: yarn run test:ci
        env:
          CI: true
